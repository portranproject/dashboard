# CI: dev·main으로 가는 PR과 dev push마다 돈다.
#   test       : 전체 테스트. InfluxDB·Grafana는 저장소의 docker-compose.yml로 띄운다(.env는 .env.example을 복사).
#                서비스가 필요한 테스트가 건너뛰어지면 실패로 센다(tests/conftest.py, PORTRAN_REQUIRE_SERVICES).
#   aws-compose: AWS 배포 구성(docker-compose.aws.yml)을 서버와 같은 방식으로 띄워 replay·UDP → collector → InfluxDB,
#                탐지 엔진 전송기 경로(HTTPS /ingest → nginx → collector → InfluxDB, M9)까지 확인.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR은 새 커밋이 오면 이전 실행을 취소한다. dev push는 병합마다 끝까지 돌린다.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10: CLAUDE.md의 최소 버전 / 3.14: 팀 PC(Ubuntu 26.04) 기본 버전
        python: ["3.10", "3.14"]
    steps:
      # 서드파티 액션은 태그 대신 커밋 SHA로 고정한다(태그가 바뀌어도 같은 코드가 돌도록)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: InfluxDB·Grafana 기동
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 120
          # Grafana는 compose에 healthcheck가 없어서 --wait는 컨테이너 실행까지만 기다린다
          for _ in $(seq 60); do
            curl -sf http://localhost:3000/api/health && exit 0
            sleep 1
          done
          echo "Grafana가 60초 안에 응답하지 않음"
          exit 1

      - name: pytest
        env:
          PORTRAN_REQUIRE_SERVICES: "1"
        run: pytest -rs

      - name: 컨테이너 로그 (실패 시)
        if: failure()
        run: docker compose logs --no-color

  aws-compose:
    name: AWS 배포 구성
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 서버와 같은 방식으로 기동 (docs/deploy.md)
        run: |
          cp .env.example .env
          echo "COMPOSE_FILE=docker-compose.yml:docker-compose.aws.yml" >> .env
          # 컨테이너는 uid 1000으로 돈다. 녹화 폴더는 호스트에 마운트되므로 주인을 맞춘다
          sudo chown 1000:1000 recordings
          # /ingest 인증서. 서버는 공인 IP로 만들고(deploy/server-deploy.sh), CI는 127.0.0.1로 만든다
          bash deploy/ingest-cert.sh 127.0.0.1 certs
          docker compose up -d --build --wait --wait-timeout 180

      - name: InfluxDB·collector가 서버 안(127.0.0.1)에서만 열렸는지
        run: |
          docker compose port influxdb 8086 | grep '^127\.0\.0\.1:'
          docker compose port --protocol udp collector 9999 | grep '^127\.0\.0\.1:'

      - name: replay(tools) → collector → InfluxDB, UDP overhead → collector
        run: |
          # 이미지에는 tests/가 없으므로 샘플을 마운트해 재생한다(지금 시각으로, 기다리지 않고)
          docker compose run --rm -v "$PWD/tests/data:/app/tests/data:ro" tools \
            python -m replay.replay "tests/data/detection/S20_L3-20_반복_UPDATE_evidence.jsonl" --env ci-replay --speed 0
          docker compose run --rm -T tools python - <<'EOF'
          import json, socket, time
          now = time.time_ns() // 1_000_000
          msg = {"type": "overhead", "ver": 1, "session": "ci", "seq": 1, "node_id": "cu", "t_start_ms": now - 3000,
                 "t_end_ms": now, "cpu": {"count": 4, "node_busy_cores": 0.5, "process_cores": 0.1},
                 "memory": {"total_bytes": 8 << 30, "used_bytes": 4 << 30, "process_rss_bytes": 300 << 20},
                 "link": [{"interface_name": "ens5", "role": "f1", "ingress": {"sctp_packet_count": 3, "wire_byte_count": 900},
                           "egress": {"sctp_packet_count": 3, "wire_byte_count": 800}}]}
          socket.socket(socket.AF_INET, socket.SOCK_DGRAM).sendto(json.dumps(msg).encode(), ("collector", 9999))
          EOF
          sleep 3  # collector는 UDP 입력을 1초마다 배치로 쓴다
          docker compose run --rm -T tools python - <<'EOF'
          from influxdb_client import InfluxDBClient
          from common.config import influx_settings
          s = influx_settings()
          with InfluxDBClient(url=s.url, token=s.token, org=s.org) as client:
              def count(flux_filter):
                  tables = client.query_api().query(
                      f'from(bucket: "{s.bucket}") |> range(start: -1h, stop: 1h) |> filter(fn: (r) => {flux_filter}) '
                      '|> group() |> count()')
                  return sum(r.get_value() for t in tables for r in t.records)
              alerts = count('r._measurement == "alert" and r._field == "severity" and r.env == "ci-replay"')
              ues = count('r._measurement == "alert_ue" and r._field == "uid" and r.env == "ci-replay"')
              overhead = count('r._measurement == "overhead" and r._field == "node_busy_cores"')
              links = count('r._measurement == "overhead_link" and r._field == "ingress_wire_bytes"')
          print(f"InfluxDB: 재생 경보 {alerts}건, 걸린 UE {ues}건, overhead {overhead}건, 링크 {links}건")
          assert (alerts, ues, overhead, links) == (3, 3, 1, 1)
          EOF
          docker compose logs --no-color collector | tail -5

      - name: /ingest — HTTPS(nginx) → collector → InfluxDB (M9)
        run: |
          code() { curl -s -o /dev/null -w '%{http_code}' --cacert certs/ingest.crt "$@"; }
          # collector의 HTTP 포트는 호스트에 열리지 않아야 한다(nginx만 compose 네트워크 안에서 넘김)
          if curl -s -m 3 -o /dev/null http://127.0.0.1:8088/healthz; then
            echo "collector HTTP 포트가 호스트에 열려 있음"; exit 1
          fi
          curl -fsS --cacert certs/ingest.crt https://127.0.0.1/healthz | grep -q '"ok"'
          test "$(code https://127.0.0.1/other)" = 404
          head -c 1100000 /dev/zero | tr '\0' x > big.txt
          test "$(code -X POST --data-binary @big.txt https://127.0.0.1/ingest)" = 413

          # 전송기와 같은 방식(인증서를 ca_file로, 파이썬 3.13+의 엄격한 검증)으로 샘플을 두 번 보낸다
          python3 - <<'EOF'
          import json, ssl, urllib.request
          ctx = ssl.create_default_context(cafile="certs/ingest.crt")
          ctx.verify_flags |= ssl.VERIFY_X509_STRICT
          body = open("tests/data/detection/T10_긴공격_evidence.jsonl", "rb").read()
          def post():
              req = urllib.request.Request("https://127.0.0.1/ingest", data=body, method="POST",
                                           headers={"Content-Type": "application/x-ndjson", "X-Env": "ci"})
              with urllib.request.urlopen(req, context=ctx, timeout=60) as r:
                  return r.status, json.load(r)
          first, again = post(), post()
          print(first, again)
          assert first == (200, {"accepted": 667, "rejected": 0, "duplicates": 0})
          assert again == (200, {"accepted": 0, "rejected": 0, "duplicates": 667})
          EOF

          docker compose run --rm -T tools python - <<'EOF'
          from influxdb_client import InfluxDBClient
          from common.config import influx_settings
          s = influx_settings()
          with InfluxDBClient(url=s.url, token=s.token, org=s.org) as client:
              def count(measurement, field):
                  tables = client.query_api().query(
                      f'from(bucket: "{s.bucket}") |> range(start: 2001-01-01T00:00:00Z, stop: now()) '
                      f'|> filter(fn: (r) => r._measurement == "{measurement}" and r._field == "{field}" and r.env == "ci") '
                      '|> group() |> count()')
                  return sum(r.get_value() for t in tables for r in t.records)
              n_alert, n_evidence = count("alert", "severity"), count("evidence", "seq")
          print(f"InfluxDB: alert {n_alert}건, evidence {n_evidence}건 (env=ci)")
          assert (n_alert, n_evidence) == (2, 665)
          EOF

          # collector가 멈추면 nginx는 502 대신 503으로 답한다(전송기가 멈추지 않고 다시 보내도록)
          docker compose stop collector
          test "$(code https://127.0.0.1/healthz)" = 503
          docker compose logs --no-color ingest | tail -5

      - name: 컨테이너 로그 (실패 시)
        if: failure()
        run: docker compose logs --no-color
