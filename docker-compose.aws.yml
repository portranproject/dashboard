# AWS(EC2) 배포용 override. docker-compose.yml 위에 겹쳐 쓴다.
# 서버의 .env에 COMPOSE_FILE=docker-compose.yml:docker-compose.aws.yml을 넣어 두면
# `docker compose up -d`만으로 두 파일이 함께 적용된다(docs/deploy.md).
#
# 기본 구성과 다른 점:
#   - collector를 컨테이너로 띄운다 (로컬은 지금처럼 호스트에서 Python 실행)
#   - InfluxDB와 collector UDP는 서버 안(127.0.0.1)에서만 받는다. 밖으로 여는 건 Grafana 3000뿐
#   - mock·replay·evaluator는 tools 서비스로 필요할 때 실행한다
#     docker compose run --rm tools python -m mock.generator --duration 600 --seed 42
#
# `!override`는 Docker Compose 2.24.4 이상이 필요하다.

# 이미지는 collector만 빌드하고 tools는 가져다 쓴다. tools에 build·depends_on을 두면
# `docker compose run tools`가 collector를 다시 만들어, 재시작 중에 보낸 UDP가 사라진다.
x-app: &app
  image: portran-app:local
  env_file: .env

services:
  influxdb:
    ports: !override
      - "127.0.0.1:${INFLUX_PORT:-8086}:8086"

  collector:
    <<: *app
    build: .
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUX_URL: http://influxdb:8086
      COLLECTOR_UDP_HOST: 0.0.0.0
    command: ["python", "-m", "collector.collector"]
    # collector는 InfluxDB 확인이 끝난 뒤 UDP 포트를 연다. 포트가 열렸으면(/proc/net/udp) 받을 준비가 된 것
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; p=':%04X' % int(os.environ.get('COLLECTOR_UDP_PORT', '9999')); sys.exit(0 if any(l.split()[1].endswith(p) for l in open('/proc/net/udp').readlines()[1:]) else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    ports:
      - "127.0.0.1:${COLLECTOR_UDP_PORT:-9999}:${COLLECTOR_UDP_PORT:-9999}/udp"
    volumes:
      - ./recordings:/app/recordings

  tools:
    <<: *app
    profiles: [tools]
    # 이미지가 없으면 받으려 하지 말고 바로 실패 (먼저 `docker compose up -d --build`)
    pull_policy: never
    environment:
      INFLUX_URL: http://influxdb:8086
      # mock·replay의 기본 출력(udp://COLLECTOR_UDP_HOST:PORT)이 collector 컨테이너를 가리키도록
      COLLECTOR_UDP_HOST: collector
    volumes:
      - ./recordings:/app/recordings
      - ./reports:/app/reports
