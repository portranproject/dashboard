# AWS(EC2) 배포용 override. docker-compose.yml 위에 겹쳐 쓴다.
# 서버의 .env에 COMPOSE_FILE=docker-compose.yml:docker-compose.aws.yml을 넣어 두면
# `docker compose up -d`만으로 두 파일이 함께 적용된다(docs/deploy.md).
#
# 기본 구성과 다른 점:
#   - collector를 컨테이너로 띄운다 (로컬은 지금처럼 호스트에서 Python 실행)
#   - InfluxDB와 collector UDP는 서버 안(127.0.0.1)에서만 받는다. 밖으로 여는 건 Grafana 3000과 ingest 443
#   - ingest(nginx)가 443에서 TLS를 받아 collector의 POST /ingest로 넘긴다(M9, 탐지 엔진 전송기용).
#     collector의 HTTP 포트는 compose 네트워크 안에만 있다. 443은 보안 그룹으로 p4 CU 박스 IP만 연다(docs/deploy.md 10절)
#     인증서는 deploy/ingest-cert.sh가 certs/에 만든다(git 제외). 배포 스크립트가 없으면 만든다
#   - mock·replay·evaluator는 tools 서비스로 필요할 때 실행한다
#     docker compose run --rm tools python -m mock.generator --duration 600 --seed 42
#
# `!override`는 Docker Compose 2.24.4 이상이 필요하다.

# 이미지는 collector만 빌드하고 tools는 가져다 쓴다. tools에 build·depends_on을 두면
# `docker compose run tools`가 collector를 다시 만들어, 재시작 중에 보낸 UDP가 사라진다.
x-app: &app
  image: portran-app:local
  env_file: .env

services:
  influxdb:
    ports: !override
      - "127.0.0.1:${INFLUX_PORT:-8086}:8086"

  collector:
    <<: *app
    build: .
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      INFLUX_URL: http://influxdb:8086
      COLLECTOR_UDP_PORT: ${COLLECTOR_UDP_PORT:-9999}
      COLLECTOR_HTTP_PORT: ${COLLECTOR_HTTP_PORT:-8088}
    # mock·replay는 UDP, 탐지 엔진 전송기는 ingest(nginx)를 거쳐 HTTP(POST /ingest)
    command: ["python", "-m", "collector.collector",
              "--in", "udp://0.0.0.0:${COLLECTOR_UDP_PORT:-9999}",
              "--in", "http://0.0.0.0:${COLLECTOR_HTTP_PORT:-8088}"]
    # collector는 InfluxDB 확인이 끝난 뒤 입력을 연다. UDP 포트가 열렸고(/proc/net/udp) /healthz가 답하면 받을 준비가 된 것
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; p=':%04X' % int(os.environ['COLLECTOR_UDP_PORT']); udp=any(l.split()[1].endswith(p) for l in open('/proc/net/udp').readlines()[1:]); http=urllib.request.urlopen('http://127.0.0.1:%s/healthz' % os.environ['COLLECTOR_HTTP_PORT'], timeout=2).status == 200; sys.exit(0 if udp and http else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 1s
    ports:
      - "127.0.0.1:${COLLECTOR_UDP_PORT:-9999}:${COLLECTOR_UDP_PORT:-9999}/udp"
    volumes:
      - ./recordings:/app/recordings

  # 탐지 엔진 전송기 → https://<공인 IP>/ingest → collector (M9). 설정은 deploy/nginx/ingest.conf.template
  ingest:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    depends_on:
      collector:
        condition: service_healthy
    # nginx 공식 이미지가 기동할 때 템플릿의 ${...}를 이 값으로 채운다. .env 전체(토큰 등)는 넘기지 않는다
    environment:
      COLLECTOR_HTTP_PORT: ${COLLECTOR_HTTP_PORT:-8088}
      COLLECTOR_HTTP_MAX_BYTES: ${COLLECTOR_HTTP_MAX_BYTES:-1048576}
    ports:
      - "${INGEST_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/ingest.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/etc/nginx/certs:ro

  tools:
    <<: *app
    profiles: [tools]
    # 이미지가 없으면 받으려 하지 말고 바로 실패 (먼저 `docker compose up -d --build`)
    pull_policy: never
    environment:
      INFLUX_URL: http://influxdb:8086
      # mock·replay의 기본 출력(udp://COLLECTOR_UDP_HOST:PORT)이 collector 컨테이너를 가리키도록
      COLLECTOR_UDP_HOST: collector
    volumes:
      - ./recordings:/app/recordings
      - ./reports:/app/reports
