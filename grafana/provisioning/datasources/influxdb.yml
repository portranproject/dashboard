apiVersion: 1

datasources:
  - name: InfluxDB
    # 대시보드 JSON이 이 uid로 datasource를 참조한다. 바꾸지 말 것.
    uid: portran-influxdb
    type: influxdb
    access: proxy
    # 컨테이너 네트워크 안의 주소 (호스트의 INFLUX_URL과 다름)
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
    secureJsonData:
      token: ${INFLUX_TOKEN}
